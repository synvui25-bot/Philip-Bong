name: Sync Telegram listings

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Import publicly available channel history
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: telegram-listing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m scripts.sync_telegram ${{ inputs.bootstrap && '--bootstrap' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Commit changed generated listings and media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/telegram
          git add -- data assets/telegram
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Telegram listings"
            git push
          fi
