name: Sync Telegram listings

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Import publicly available channel history
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: telegram-listing-sync
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m scripts.sync_telegram ${{ inputs.bootstrap && '--bootstrap' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Commit changed generated listings and media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/telegram
          git add -- data assets/telegram
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Telegram listings"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Stage the static root site
        run: |
          mkdir -p _site/data
          cp index.html *.webp _site/
          cp -R assets _site/
          cp data/telegram-listings.json _site/data/
      - name: Upload synchronized site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: sync
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

